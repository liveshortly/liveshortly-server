# Local full stack WITH Google auth — an override on top of docker-compose.yml.
#
# Adds an nginx front so web + api share one origin (http://localhost:8080),
# which is what makes the session cookie and Google OAuth work locally exactly
# like production. Without it, the cross-origin cookie between web:3000 and
# api:8000 is dropped and login silently fails.
#
# Run (Google secrets come from .env.auth, loaded straight into the api):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Then open http://localhost:8080 (NOT :3000 — auth + live SSE only work via
# nginx here). The base :3000 web port proxies /api through Next.js rewrites,
# which buffer SSE, so live streaming never arrives there.
services:
  api:
    # GOOGLE_CLIENT_ID / SECRET / SESSION_SECRET come from .env.auth, already
    # loaded by the base compose (env_file, required:false).
    environment:
      # Force the single nginx origin. These WIN over the same keys in
      # .env.auth (which are set to :3000), so OAuth + cookie use :8080.
      # Drives OAuth allowed host + cookie Secure flag (http → non-secure,
      # so the cookie is accepted over plain localhost).
      WEB_BASE_URL: http://localhost:8080
      OAUTH_ALLOWED_HOSTS: localhost:8080

  web:
    build:
      args:
        # Baked into the browser bundle — the browser calls the api through nginx
        # at the same origin. Changing this needs --build.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_INTERNAL_URL: http://api:8000

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api, web]
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [liveshortly]
