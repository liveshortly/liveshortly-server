AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Standalone EC2 box for LiveShortly (api + redis + web via docker compose;
  Postgres is external/Supabase). Access is SSH (reusing the same deploy key
  pair as the existing box, for rsync-based deploys) plus AWS Systems Manager
  Session Manager as a keyless fallback. An Elastic IP is attached so the
  public address survives instance replacement (point Cloudflare DNS / the
  deploy workflow's `host` input at the Elastic IP, not the instance's
  ephemeral public IP).

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large, c6i.large, m6i.large]

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch the instance in.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (must auto-assign public IPs, or the instance won't reach the internet for the Elastic IP / package installs).

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: >
      Existing EC2 key pair whose private half matches the DEPLOY_SSH_KEY repo
      secret already used by deploy.yml, so the same secret works against this
      box too. Must already exist in this region — CloudFormation does not
      create key pairs.

  RootVolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 200

  LatestUbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Resolved via the Canonical-maintained public SSM parameter so the AMI always tracks current Ubuntu 22.04, per region, without hardcoding an AMI id.

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: Project, Value: liveshortly }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} - nginx origin + SSH deploy"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP - Cloudflare origin pull" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS - only needed if/when Cloudflare Full(strict) is enabled" }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0, Description: "SSH - GitHub Actions runners have no fixed IP, so this stays open; DEPLOY_SSH_KEY is the actual gate" }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Project, Value: liveshortly }

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: Project, Value: liveshortly }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestUbuntuAmiId
      SubnetId: !Ref SubnetId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSizeGiB
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-ec2" }
        - { Key: Project, Value: liveshortly }
      # Mirrors the "Host prep" steps in deploy/DEPLOY.md so the box is ready
      # for `docker compose -f docker-compose.prod-ec2.yml up -d --build` as
      # soon as the code is rsynced over. Idempotent-ish (safe if re-run manually).
      UserData:
        Fn::Base64: |
          #!/usr/bin/env bash
          set -euxo pipefail

          # Swap - Next.js production build needs headroom on small instances.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2 nginx rsync
          systemctl enable --now docker
          usermod -aG docker ubuntu

          # Ubuntu's official AMIs ship the SSM agent as a snap, enabled by
          # default - this just makes sure it's actually running.
          snap start amazon-ssm-agent || true

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      AllocationId: !GetAtt ElasticIP.AllocationId

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Description: Elastic IP - point Cloudflare DNS here.
    Value: !Ref ElasticIP
  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
  SsmConnectCommand:
    Description: Run this locally (with the same AWS creds) to get a shell on the box - no SSH key needed.
    Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region}"
