# LiveShortly — nginx for LOCAL development (docker-compose.local.yml).
#
# Mirrors the production reverse proxy so auth behaves the same locally: web and
# api are served under ONE origin (http://localhost:8080). That single origin is
# what makes the `ls_session` cookie and Google OAuth work — split ports
# (web:3000 + api:8000) would drop the cross-origin cookie.
#
#   /                       -> web  (Next.js, web:3000)
#   /api/, /health, /device -> api  (Go,      api:8000)   [SSE-aware]
#   /auth/                  -> api  (Google OAuth)
#
# X-Forwarded-Proto is pinned to http: the Go api builds the OAuth redirect_uri
# and decides cookie Secure-ness from it, and local has no TLS.

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 16m;

    # SSE at /api/sessions/{id}/stream — buffering OFF, long read timeout.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /device {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /auth/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
