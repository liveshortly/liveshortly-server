# LiveShortly — nginx reverse proxy for liveshortly.com
#
# TLS is terminated HERE, by a Let's Encrypt certificate, even though Cloudflare
# proxies the record — so Cloudflare can run Full (strict) against a real cert
# rather than trusting an unencrypted origin hop.
#   :80  -> ACME challenges; everything else 301s to https
#   :443 -> /              -> web  (Next.js, 127.0.0.1:3000)
#           /api/, /health -> api  (Go,      127.0.0.1:8000)   [SSE-aware]
#
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
#          `nginx -t && systemctl reload nginx`. The deploy workflow does this.
#
# CLOUDFLARE IS IN FRONT (orange cloud): keep SSL/TLS mode **Full (strict)**,
# never Flexible. Flexible makes Cloudflare fetch the origin over
# :80, which this config 301s back to https — an infinite redirect loop. The map
# below spares that loop for Full/Full (strict), where Cloudflare arrives on :443.

# Restore the real visitor IP from Cloudflare (so logs/CORS see the client, not CF).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# A request that already arrived over TLS somewhere upstream must not be
# redirected again — that is what turns a proxy in front into a redirect loop.
map $http_x_forwarded_proto $ls_upgrade_to_https {
    default 1;
    https   0;
}

server {
    listen 80;
    listen [::]:80;
    server_name liveshortly.com www.liveshortly.com server.liveshortly.com;

    # Certbot renews over HTTP-01, so this must stay reachable on :80 and must
    # be matched BEFORE the redirect below. `^~` beats the prefix match on /.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        if ($ls_upgrade_to_https) {
            return 301 https://$host$request_uri;
        }
        # Only reached when something upstream already terminated TLS.
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}

server {
    # `http2 on;` is nginx >= 1.25 only; Ubuntu 24.04 ships 1.24, so use the
    # listen-parameter form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liveshortly.com www.liveshortly.com server.liveshortly.com;

    ssl_certificate     /etc/letsencrypt/live/liveshortly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liveshortly.com/privkey.pem;

    # Set inline rather than including certbot's options-ssl-nginx.conf: that
    # file ships with the certbot NGINX PLUGIN, which this box does not install
    # (certs are issued with the webroot plugin), so the include would break the
    # config on a rebuilt host. No ssl_dhparam either — TLS 1.3 does not use it
    # and the 1.2 suites below are all ECDHE.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Uncomment to force HTTPS at the browser, so even the FIRST request never
    # goes out in cleartext. Left off by default because it is sticky: browsers
    # cache it for the whole max-age and you cannot call it back early.
    # add_header Strict-Transport-Security "max-age=15768000" always;

    # Generous limits; no big uploads in the app today.
    client_max_body_size 16m;

    # --- API + health (Go service) ---
    # SSE lives at /api/sessions/{id}/stream — buffering OFF and a long read
    # timeout are essential so events flush immediately and the stream stays open.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Device-flow approval page (Go service) ---
    location /device {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Google OAuth endpoints (Go service) ---
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Web (Next.js) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
