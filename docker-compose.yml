services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [liveshortly]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveshortly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveshortly}
      POSTGRES_DB: ${POSTGRES_DB:-liveshortly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./api/infra/postgres/002-auth.sql:/docker-entrypoint-initdb.d/02-auth.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveshortly} -d ${POSTGRES_DB:-liveshortly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [liveshortly]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Google OAuth + session secret for local login. Optional: without the file
    # the api still boots (auth disabled). Values here don't override the ones
    # set explicitly in `environment:` below.
    env_file:
      - path: .env.auth
        required: false
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-liveshortly}:${POSTGRES_PASSWORD:-liveshortly}@postgres:5432/${POSTGRES_DB:-liveshortly}
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/data/sessions
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEFAULT_USER_HANDLE: ${DEFAULT_USER_HANDLE:-you}
    volumes:
      - api_data:/app/data/sessions
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [liveshortly]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side (SSR) calls reach the api over the docker network, since
      # localhost inside this container is the web container itself.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [liveshortly]

networks:
  liveshortly:
    name: liveshortly_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_data:
