name: Deploy to production

# Auto-deploy to server.liveshortly.com on every push to main.
# Uses a dedicated SSH deploy key (secret DEPLOY_SSH_KEY) + pinned host key
# (secret DEPLOY_KNOWN_HOSTS). Rsyncs the repo to the box, then rebuilds the
# docker stack. The prod .env on the box is preserved (excluded from rsync).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; let an in-flight one finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 32.236.46.221
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /home/ubuntu/LiveShortly
  # Keepalives so the long, silent Go compile doesn't let an idle middlebox drop
  # the SSH connection (a quiet build can exceed NAT/idle timeouts → broken pipe).
  SSH_OPTS: -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o BatchMode=yes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can diff the pushed range and rebuild only the
          # service(s) that actually changed.
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Also pin the current host's key at deploy time so the pipeline
          # self-heals when the server IP changes (the pinned secret can lag the
          # actual EC2 host). Appends — the secret's keys still apply if valid.
          ssh-keyscan -T 10 -t rsa,ed25519 "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync code to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude '.env.auth' \
            --exclude 'data/' \
            --exclude 'build.log' \
            -e "ssh ${SSH_OPTS}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Write Google OAuth env on server (from secrets)
        run: |
          ssh ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat > ${DEPLOY_PATH}/.env.auth && chmod 600 ${DEPLOY_PATH}/.env.auth" <<EOF
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          OAUTH_ALLOWED_HOSTS=server.liveshortly.com,liveshortly.com
          WEB_BASE_URL=https://server.liveshortly.com
          EOF

      - name: Decide which services to rebuild
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          # Rebuild everything when there's no valid base (manual run, first push,
          # or the base commit isn't in history) — the safe fallback.
          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "services=api web" >> "$GITHUB_OUTPUT"
            echo "→ rebuild: api web (no valid diff base)"
            exit 0
          fi
          FILES="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "changed files:"; echo "$FILES"
          SVCS=""
          echo "$FILES" | grep -qE '^api/' && SVCS="$SVCS api"
          echo "$FILES" | grep -qE '^web/' && SVCS="$SVCS web"
          # Compose or deploy-plumbing changes → rebuild both, to be safe.
          echo "$FILES" | grep -qE '^docker-compose|^deploy/' && SVCS="api web"
          SVCS="$(echo $SVCS | xargs -n1 | sort -u | xargs)"
          echo "services=$SVCS" >> "$GITHUB_OUTPUT"
          echo "→ rebuild: '${SVCS:-<none — config-only up>}'"

      - name: Build & restart stack
        run: |
          # Pipe the remote build script over SSH (avoids fragile inline
          # heredocs); it rebuilds only the changed services (no full-stack down)
          # and reports its exit code back.
          ssh ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- ${{ steps.changed.outputs.services }}" < deploy/remote-build.sh

      - name: Health check (origin, over SSH)
        run: |
          # Check the origin directly on the box — the public HTTPS path can be
          # unreachable from GitHub runners (Cloudflare), which is unrelated to
          # whether the deploy is healthy.
          for i in $(seq 1 12); do
            code=$(ssh ${SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health" || true)
            echo "attempt $i: origin /health -> ${code}"
            [ "$code" = "200" ] && echo "✅ deploy healthy" && exit 0
            sleep 5
          done
          echo "❌ health check failed"; exit 1
