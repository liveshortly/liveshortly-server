name: Bug report
description: Something in LiveShortly (web app or server) is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not paste secrets, tokens or private session links.
  - type: input
    id: where
    attributes:
      label: Where did you see it?
      description: liveshortly.com or self-hosted (and the version from /changelog)
  - type: input
    id: cli
    attributes:
      label: live CLI version, agent and OS
      description: Output of `live version`, e.g. v2.4.0, claude, macOS 15
