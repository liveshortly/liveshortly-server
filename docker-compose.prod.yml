# Production compose — used ALONE (not as an override):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev compose:
#   - postgres & redis are NOT published to the host (internal network only)
#   - api & web bind to 127.0.0.1 so the HOST nginx can reverse-proxy them;
#     nothing app-level is exposed to the public internet except via nginx
#   - restart: always everywhere
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    networks: [liveshortly]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveshortly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-liveshortly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./api/infra/postgres/002-auth.sql:/docker-entrypoint-initdb.d/02-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveshortly} -d ${POSTGRES_DB:-liveshortly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    networks: [liveshortly]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PORT: 8000
      # Defaults to the bundled postgres service. Set DATABASE_URL in the
      # server's .env to point at a managed database instead (the deploy
      # workflow excludes .env from rsync, so it survives deploys). Rolling
      # back is deleting that line and restarting the api.
      #
      # A managed database must be in the SAME REGION as this box: the api
      # issues several queries per request, so every millisecond of round-trip
      # is paid multiple times per page.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-liveshortly}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liveshortly}}
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/data/sessions
      CORS_ORIGINS: ${CORS_ORIGINS:-https://server.liveshortly.com}
      DEFAULT_USER_HANDLE: ${DEFAULT_USER_HANDLE:-you}
    # Google OAuth secrets/config live here (written from GitHub secrets by the
    # deploy workflow). Optional so dev/local without auth still boots.
    env_file:
      - path: .env.auth
        required: false
    volumes:
      - api_data:/app/data/sessions
    # bound to loopback — only the host nginx can reach it
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [liveshortly]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://server.liveshortly.com}
    restart: always
    depends_on:
      api: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://server.liveshortly.com}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [liveshortly]

networks:
  liveshortly:
    name: liveshortly_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_data:
