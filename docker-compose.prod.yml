# Production compose — used ALONE (not as an override):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# This box (liveshortly-app) runs nginx (on the HOST) + api + web only.
# Its two stateful dependencies live OFF this box:
#   - Postgres  → Supabase (managed, external)
#   - Redis     → the liveshortly-redis EC2 box, private VPC address only
# Both are supplied as DATABASE_URL / REDIS_URL in .env.auth, which the deploy
# workflow writes from GitHub secrets and rsync never overwrites.
#
# Differences from the dev compose:
#   - api & web bind to 127.0.0.1 so the HOST nginx can reverse-proxy them;
#     nothing app-level is exposed to the public internet except via nginx
#   - restart: always everywhere
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 8000
      STORAGE_PATH: /app/data/sessions
      CORS_ORIGINS: ${CORS_ORIGINS:-https://server.liveshortly.com}
      DEFAULT_USER_HANDLE: ${DEFAULT_USER_HANDLE:-you}
    # DATABASE_URL (Supabase), REDIS_URL (redis box) and the Google OAuth
    # secrets all live here — written from GitHub secrets by the deploy
    # workflow, chmod 600, never rsynced. Required: without it the api would
    # start with no database and fail at the first request instead of here.
    env_file:
      - path: .env.auth
        required: true
    volumes:
      - api_data:/app/data/sessions
    # bound to loopback — only the host nginx can reach it
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [liveshortly]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://server.liveshortly.com}
    restart: always
    depends_on:
      api: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://server.liveshortly.com}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [liveshortly]

networks:
  liveshortly:
    name: liveshortly_net
    driver: bridge

volumes:
  api_data:
